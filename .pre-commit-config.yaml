# Local hooks use the versions pinned in each project's lockfile, so they match CI.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --directory backend ruff check --fix .
        language: system
        files: ^backend/
        pass_filenames: false
      - id: ruff-format
        name: ruff format
        entry: uv run --directory backend ruff format .
        language: system
        files: ^backend/
        pass_filenames: false
      - id: pyright
        name: pyright
        entry: uv run --directory backend pyright
        language: system
        files: ^backend/
        pass_filenames: false
      - id: biome
        name: biome
        entry: pnpm --dir frontend exec biome check --write .
        language: system
        files: ^frontend/
        pass_filenames: false
      - id: typecheck
        name: typecheck
        entry: pnpm --dir frontend exec tsc -b
        language: system
        files: ^frontend/
        pass_filenames: false
