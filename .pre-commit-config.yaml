# Local hooks use the versions pinned in backend/uv.lock, so they match CI.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --directory backend ruff check --fix .
        language: system
        files: ^backend/
        pass_filenames: false
      - id: ruff-format
        name: ruff format
        entry: uv run --directory backend ruff format .
        language: system
        files: ^backend/
        pass_filenames: false
      - id: pyright
        name: pyright
        entry: uv run --directory backend pyright
        language: system
        files: ^backend/
        pass_filenames: false
