<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Life OS — Settings, all states</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>:root{
  /* neutral */
  --n50:#f9fafb;--n100:#f3f4f6;--n200:#e5e7eb;--n300:#d1d5db;--n400:#9ca3af;--n500:#6b7280;--n600:#4b5563;--n900:#111827;
  /* accent = brand */
  --acc100:#f1f0f7;--acc200:#e6e3f1;--acc500:#a18ec4;--acc600:#8f74b3;--acc700:#7e61a0;
  /* semantic text */
  --text-primary:var(--n900);--text-secondary:var(--n600);--text-tertiary:var(--n500);--text-disabled:var(--n400);
  --bg-app:#ffffff;--bg-surface:#fff;--bg-column:#eceef1;--border:var(--n200);
  --priority-high:#cc363c;--priority-medium:#c9510c;--priority-low:var(--n400);--danger:#cc363c;
  /* spacing tokens */
  --card-pad-y:8px;--card-pad-x:12px;--card-gap:2px;--subtask-row:20px;--stack-gap:6px;
  --col-pad:0px;--col-w:260px;--board-gap:16px;--group-gap:12px;--side-item:28px;
  --tag-h:20px;--counter-h:18px;
  --r-card:8px;--r-control:6px;--r-check:4px;
}
/* area palettes: --a-solid(500) --a-tint(100) --a-text(700) --a-ink(800) --a-border(300) */
.career{--a-solid:#3579c2;--a-tint:#e5edf9;--a-text:#1f4c85;--a-ink:#1d416f;--a-border:#94bbe5}
.finance{--a-solid:#11bbb3;--a-tint:#cbfcf4;--a-text:#0d7876;--a-ink:#105f5f;--a-border:#5cece0}
.health{--a-solid:#ca6a93;--a-tint:#f8ebf1;--a-text:#9c3a5c;--a-ink:#81334d;--a-border:#e8b9d0}
.personal{--a-solid:#b181b4;--a-tint:#f5f0f7;--a-text:#7a4f7c;--a-ink:#654266;--a-border:#ddc7e0}
.relation{--a-solid:#cba927;--a-tint:#f6f4cb;--a-text:#8c621c;--a-ink:#754f1e;--a-border:#e4d460}
.home{--a-solid:#cc6b43;--a-tint:#f7e9dd;--a-text:#9e4330;--a-ink:#7f372d;--a-border:#e2af8f}
.noarea{--a-solid:var(--n400);--a-tint:var(--n100);--a-text:var(--n600);--a-ink:var(--n900);--a-border:var(--n300)}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,system-ui,sans-serif;color:var(--text-primary);background:var(--bg-app);-webkit-font-smoothing:antialiased;font-size:13px;line-height:18px}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none}
svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

/* type tokens */
.t-page{font-size:20px;line-height:28px;font-weight:600}
.t-heading{font-size:14px;line-height:20px;font-weight:600}
.t-card{font-size:14px;line-height:20px;font-weight:500}
.t-body{font-size:13px;line-height:18px;color:var(--text-secondary)}
.t-subtask{font-size:12px;line-height:16px;color:var(--text-secondary)}
.t-meta{font-size:12px;line-height:16px;color:var(--text-tertiary)}
.t-label{font-size:12px;line-height:16px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text-tertiary)}

.app{display:flex;height:100vh;min-width:1280px}
/* rail */
.rail{width:48px;flex:none;padding:8px 4px;display:flex}
.rail-pill{flex:1;background:var(--acc200);border-radius:20px;display:flex;flex-direction:column;align-items:center;padding:6px 0;gap:4px}
.logo{width:28px;height:28px;border-radius:50%;background:var(--acc700);color:#fff;display:grid;place-items:center;font-weight:600;font-size:12px;margin-bottom:6px}
.rail a{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--acc600)}
.rail a svg{width:18px;height:18px}
.rail a.on{background:#fff;color:var(--acc700);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.rail a:hover{background:rgba(255,255,255,.6)}
.rail .sp{flex:1}
/* sidebar */
.side{width:240px;flex:none;background:var(--bg-surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:16px 12px}
.side-head{height:48px;display:flex;align-items:center;padding:0 8px;margin-top:-8px}
.side .sec{margin-top:0}
.side-divider{height:1px;background:var(--border);margin:16px 0;flex:none}
.side .t-label{padding:0 8px;height:24px;display:flex;align-items:center}
.item{height:var(--side-item);display:flex;align-items:center;gap:8px;padding:0 8px;border-radius:var(--r-control);color:var(--text-secondary);font-weight:500;cursor:default}
.item:hover{background:var(--n100)}
.item.on{background:var(--n100);color:var(--text-primary);box-shadow:inset 2px 0 0 var(--acc600)}
.item>.dot{margin:0 4px}
.item .c{margin-left:auto;font-size:11px;font-weight:500;color:var(--text-tertiary)}
.item.sub{padding-left:28px}
.dot{width:8px;height:8px;border-radius:2px;background:var(--a-solid);flex:none}
.side .grow{flex:1}

/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.page-head{height:32px;margin-top:24px;flex:none;display:flex;align-items:center;gap:12px;padding:0 24px}
.seg{display:flex;background:var(--n200);border-radius:var(--r-control);padding:2px;height:28px}
.seg span{padding:0 12px;display:flex;align-items:center;font-size:12px;font-weight:500;color:var(--text-secondary);border-radius:4px}
.seg span.on{background:#fff;color:var(--text-primary);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.btn{height:28px;display:inline-flex;align-items:center;gap:6px;padding:0 12px;border-radius:var(--r-control);font:500 12px/16px Inter,sans-serif;border:1px solid var(--border);background:#fff;color:var(--text-secondary);cursor:pointer}
.btn.primary{background:var(--acc700);border-color:var(--acc700);color:#fff}
.btn svg{width:16px;height:16px}
.head-sp{flex:1}

.board{flex:1;display:flex;gap:var(--board-gap);padding:16px 24px 24px;overflow-x:auto;align-items:flex-start;
  mask-image:linear-gradient(to right,#000 calc(100% - 16px),transparent)}
.col{width:var(--col-w);flex:none;background:transparent;border-radius:var(--r-card);padding:var(--col-pad);display:flex;flex-direction:column;max-height:100%}
.col-head{height:32px;display:flex;align-items:center;gap:8px;padding:0 4px;margin-bottom:6px}
.col-head .t-heading{font-size:16px;line-height:24px}
.col-head .dot{width:10px;height:10px;border-radius:2px}
.col-head .t-heading{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.counter{height:var(--counter-h);min-width:18px;padding:0 6px;border-radius:999px;background:var(--n200);color:var(--text-secondary);font-size:11px;line-height:16px;font-weight:500;display:inline-flex;align-items:center;justify-content:center}
.icon-btn{width:24px;height:24px;border-radius:var(--r-control);display:grid;place-items:center;color:var(--text-tertiary);margin-left:auto}
.icon-btn:hover{background:var(--n100)}
.icon-btn svg{width:16px;height:16px}
.group{display:flex;align-items:center;gap:6px;height:24px;padding:0 4px;margin:var(--group-gap) 0 4px}
.col-head + .group{margin-top:0}
.group .dot{width:6px;height:6px}
.group svg{width:12px;height:12px;color:var(--text-tertiary)}
.group .counter{height:16px;min-width:16px;padding:0 4px;font-size:11px;background:transparent;color:var(--text-tertiary)}
.stack{display:flex;flex-direction:column;gap:var(--stack-gap)}

/* cards */
.card{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--r-card);padding:var(--card-pad-y) var(--card-pad-x);display:flex;gap:8px}
.card:hover,.card.hover{background:var(--n100);border-color:var(--n300)}
.card .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--card-gap)}
.check{width:16px;height:16px;border-radius:var(--r-check);border:2px solid var(--a-solid);flex:none;margin-top:2px;display:grid;place-items:center}
.check.done{background:var(--a-solid)}
.check.done::after{content:"";width:7px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.meta svg{width:12px;height:12px}
.meta .sep{color:var(--n300)}
.flag-high{color:var(--priority-high)}.flag-med{color:var(--priority-medium)}.flag-low{color:var(--priority-low)}
.overdue{color:var(--danger)}
.card.done .t-card{color:#6b7280;text-decoration:line-through}
.card.done .t-meta{color:var(--text-disabled)}
.subtasks{display:flex;flex-direction:column;gap:2px;margin-top:0}
.subtask{height:var(--subtask-row);display:flex;align-items:center;gap:8px}
.subtask .check{width:14px;height:14px;margin:0;border-width:2px}
.subtask.done span{color:#6b7280;text-decoration:line-through}
.sub-counter{margin-left:auto;align-self:flex-start;height:var(--counter-h);padding:0 6px;border-radius:999px;border:1px solid var(--border);font-size:11px;font-weight:500;color:var(--text-secondary);display:inline-flex;align-items:center;gap:2px}
.sub-counter svg{width:12px;height:12px}
.card.event{background:var(--a-tint);border-color:transparent}
.card.event .t-card{color:var(--a-ink)}
.card.event .t-meta{color:var(--a-text)}
.ev-icon{width:16px;height:16px;border-radius:var(--r-check);background:var(--a-solid);color:#fff;display:grid;place-items:center;flex:none;margin-top:2px}
.ev-icon svg{width:11px;height:11px;stroke-width:2.2}
.card.routine{border-color:var(--border)}
.check.round{border-radius:50%}
.ring{width:16px;height:16px;border-radius:50%;border:2px solid var(--a-solid);flex:none;margin-top:1px}
.mark{width:16px;height:16px;flex:none;margin-top:2px;color:var(--a-solid);display:grid;place-items:center}
.mark svg{width:16px;height:16px}
.progress{display:flex;align-items:center;gap:8px;margin-top:0}
.body>.bar{flex:none;width:100%;margin:2px 0}
.meta-row{display:flex;align-items:center;gap:8px}
.meta-row .pct{margin-left:auto}
.meta-row .sub-counter{margin-left:auto;align-self:center}
.bar{flex:1;height:4px;border-radius:999px;background:var(--n200);overflow:hidden}
.bar i{display:block;height:100%;background:var(--a-solid);border-radius:999px}
.pct{font-size:12px;line-height:16px;font-weight:500;color:var(--text-secondary)}

/* tags */
.tag{height:var(--tag-h);padding:0 8px;border-radius:999px;display:inline-flex;align-items:center;gap:4px;font-size:11px;line-height:16px;font-weight:500;white-space:nowrap}
.tag.neutral{background:var(--n100);color:var(--text-secondary)}
.tag.area{background:var(--a-tint);color:var(--a-text)}
.tag.area .dot{width:6px;height:6px}
.tag.prio-high{background:#fce4e5;color:#a5282d}
.tag.prio-med{background:#ffedd5;color:#9a3412}
.tag.accent{background:var(--acc100);color:var(--acc700)}
.tag svg{width:12px;height:12px}

/* detail panel (floating overlay) */
.panel{position:fixed;top:8px;right:8px;bottom:8px;width:400px;background:#fff;border-radius:12px;border:1px solid var(--border);
  box-shadow:0 2px 8px rgba(0,0,0,.06),0 -6px 12px rgba(0,0,0,.03),0 14px 28px rgba(0,0,0,.08);display:flex;flex-direction:column}
.panel-head{height:48px;display:flex;align-items:center;gap:4px;padding:0 12px 0 16px;border-bottom:1px solid var(--border)}
.panel-body{padding:16px;display:flex;flex-direction:column;gap:16px;overflow:auto}
.title-row{display:flex;gap:8px;align-items:flex-start}
.title-row .check{width:18px;height:18px;margin-top:3px}
.panel h2{font-size:16px;line-height:24px;font-weight:600}
.props{display:grid;grid-template-columns:96px 1fr;row-gap:4px;align-items:center}
.props .k{font-size:12px;line-height:16px;color:var(--text-tertiary);display:flex;align-items:center;gap:6px;height:28px}
.props .k svg{width:16px;height:16px}
.props .v{display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-height:28px;font-size:12px;color:var(--text-primary)}
.divider{height:1px;background:var(--border)}
.panel .subtask{height:28px;padding:0 4px;border-radius:var(--r-control)}
.panel .subtask:hover{background:var(--n100)}
.panel .subtask .check{width:14px;height:14px}
.panel .subtask span{font-size:13px;color:var(--text-primary)}
.notes{font-size:13px;line-height:18px;color:var(--text-secondary)}
.tags-demo{display:flex;flex-direction:column;gap:8px}
.tags-demo .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

.details-toggle{display:flex;align-items:center;gap:6px;height:24px;background:none;border:0;padding:0;cursor:pointer;font:inherit}
.details-toggle .chev{width:12px;height:12px;color:var(--text-tertiary);transition:transform .15s}
.details.open .chev{transform:rotate(90deg)}
.details-body{display:none;margin-top:8px}
.details.open .details-body{display:block}
.crumbs{flex:1;min-width:0;display:flex;align-items:center;gap:6px;font-size:12px;line-height:16px;color:var(--text-tertiary);white-space:nowrap;overflow:hidden}
.crumbs .dot{width:8px;height:8px}
.crumbs .sep{color:var(--n300)}
.quick{display:flex;gap:4px;margin:-8px 0 0 18px}
.qbtn{height:28px;min-width:28px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 8px;border:0;border-radius:var(--r-control);background:none;font:500 12px/16px Inter,sans-serif;color:var(--text-secondary);cursor:pointer}
.qbtn:hover{background:var(--n100)}
.qbtn svg{width:16px;height:16px}
.qbtn.overdue{color:var(--danger)}
.qbtn.flag-high{color:var(--priority-high)}
.panel-head{gap:8px}
.head-check{width:18px;height:18px;margin:0}
.vdiv{width:1px;height:20px;background:var(--border);flex:none}
/* spacing inspector */
.toggle{position:fixed;left:312px;bottom:12px;z-index:5}
body.inspect .card{outline:1px dashed var(--acc600);outline-offset:-1px;background-image:linear-gradient(rgba(161,142,196,.18),rgba(161,142,196,.18));background-clip:padding-box}
body.inspect .card .body,body.inspect .card>.check,body.inspect .card>.ev-icon,body.inspect .card>.mark,body.inspect .card>.ring{background:#fff;outline:1px solid rgba(143,116,179,.4)}
body.inspect .col{outline:1px dashed #cc6b43}
body.inspect .stack{background:rgba(204,107,67,.12)}
body.inspect .tag,body.inspect .counter,body.inspect .sub-counter{outline:1px solid #0b9895}
body.inspect .item{outline:1px dashed var(--n400)}

/* ---------- batch A additions ---------- */
svg{stroke-width:2}
:root{--acc-solid:#a18ec4}
.career{--a-past:#f3f6fc}.finance{--a-past:#f0fdfb}.health{--a-past:#fbf4f8}.personal{--a-past:#fbf8fb}.relation{--a-past:#fbfbeb}.home{--a-past:#fbf6f1}.noarea{--a-past:var(--n50)}
.side{border-right:0;overflow:auto}
.board{mask-image:none;overflow:hidden;min-height:0;align-items:stretch}
.col{min-height:0}
.col .stack{overflow:auto;min-height:0;padding-bottom:4px}
.col.unsched{width:240px;flex:none;padding-right:16px;border-right:1px solid var(--border)}
.week{flex:1;min-width:0;display:flex;gap:var(--board-gap)}
.col.day:not(.unsched){flex:1;min-width:176px;width:auto;position:relative}
.col-head .icon-btn{opacity:0}.col:hover .col-head .icon-btn,.col.today .col-head .icon-btn{opacity:1}
.daynum{font-size:16px;line-height:24px;font-weight:600;color:var(--text-primary);min-width:24px;height:24px;border-radius:999px;display:inline-grid;place-items:center;margin-left:-4px}
.col.past .col-head .t-heading,.col.past .daynum{color:var(--text-tertiary)}
.col.today .daynum{background:var(--acc-solid);color:#fff;padding:0 6px;margin-left:-2px}
/* meta project */
.mp{display:inline-flex;align-items:center;gap:4px;min-width:0}
.mp .pi{color:var(--a-solid)}
.card.done .mp .pi{color:var(--text-disabled)}
.meta{flex-wrap:wrap;min-width:0;white-space:nowrap;row-gap:0}
.meta .lead{display:inline-flex;align-items:center;gap:6px;flex:none}
.meta .mp{max-width:100%}
.meta .sub-counter{margin-left:auto;flex:none}
.meta:has(.sub-counter) .mp{max-width:calc(100% - 52px)}
.meta-row .meta{flex:1;min-width:0}
.mp .pn{overflow:hidden;text-overflow:ellipsis;min-width:0}
.meta .overdue,.meta .dd,.meta .sep,.meta>svg{flex:none}
.card.event .meta{white-space:normal;flex-wrap:wrap}
.card .subtask{height:auto;min-height:20px;align-items:flex-start;padding:2px 0}
.card .subtask .check{margin-top:1px}
.card .subtasks{gap:0}
/* events */
.card.event.past{background:var(--a-past)}
.card.event.past .ev-icon{background:var(--a-border)}
/* routine card */
.pring{width:16px;height:16px;border-radius:50%;flex:none;margin-top:2px;background:conic-gradient(var(--n500) var(--p),var(--n200) 0);
  -webkit-mask:radial-gradient(circle,transparent 4.5px,#000 5px);mask:radial-gradient(circle,transparent 4.5px,#000 5px)}
.card.routine .t-card{font-weight:500}
.step .check{margin:0}
.step.done span.t-subtask{color:#6b7280;text-decoration:line-through}
.step.missed .check,.step.skipped .check{border-color:var(--n300);position:relative}
.step.missed .check::after{content:"×";font-size:12px;line-height:10px;color:var(--n400);font-weight:600}
.step.skipped .check::after{content:"";width:6px;height:2px;background:var(--n400);border-radius:1px}
.step.missed span.t-subtask,.step.skipped span.t-subtask{color:var(--text-tertiary)}
.meta svg.flame{color:var(--n500)}
/* mini month */
.mm{padding:0 4px}
.mm-head{height:28px;display:flex;align-items:center;gap:2px;margin-bottom:4px}
.mm-head .t-heading{font-size:13px}
.mm-grid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px;text-align:center;font-size:11px;line-height:16px}
.mm-grid b{font-weight:600;color:var(--text-tertiary);height:20px;display:grid;place-items:center}
.mm-grid span{height:24px;display:grid;place-items:center;color:var(--text-secondary);font-weight:500;position:relative}
.mm-grid span.o{color:var(--n400)}
.mm-grid span.w{background:var(--n100)}
.mm-grid span.w:nth-child(7n+1){border-radius:var(--r-control) 0 0 var(--r-control)}
.mm-grid span.w:nth-child(7n){border-radius:0 var(--r-control) var(--r-control) 0}
.mm-grid span.t{color:#fff}
.mm-grid span.t::before{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:var(--acc-solid);z-index:0}
.mm-grid span.t{z-index:0}
.mm-grid span.t{isolation:isolate}
.mm-grid span.t::before{z-index:-1}
.mini-check{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--n400);display:grid;place-items:center;margin:0 1px}
.mini-check.on{background:var(--n600);border-color:var(--n600);color:#fff}
.mini-check svg{width:10px;height:10px;stroke-width:3}
/* header */
.page-head .nav{display:flex;gap:2px;margin-left:-6px}
.page-head .nav .icon-btn{margin:0;width:28px;height:28px}
.btn.icon{width:28px;padding:0;justify-content:center}
.btn.primary{background:var(--acc-solid);border-color:var(--acc-solid)}
/* selected card */
.card.sel{box-shadow:0 0 0 2px var(--acc600);border-color:transparent}
/* drag */
.drop{height:38px;border:1.5px dashed var(--acc500);border-radius:var(--r-card);background:var(--acc100);display:none}
.drag-ghost{display:none;position:absolute;left:14px;top:178px;width:calc(100% - 6px);background:#fff;transform:rotate(-2deg);
  box-shadow:0 2px 8px rgba(0,0,0,.06),0 14px 28px rgba(0,0,0,.08);z-index:3}
body.s-drag .drop,body.s-drag .drag-ghost{display:flex}
body.s-drag .card.src{opacity:.4}
/* panel/picker visibility */
.panel,.picker,.scrim,.modal,.toast{display:none}
body.s-panel .panel,body.s-panel .picker{display:flex}
body.s-series .panel{display:flex}
body.s-series .scrim,body.s-series .modal{display:flex}
body.s-toast .toast{display:flex}
body:not(.s-panel):not(.s-series) .card.sel{box-shadow:none;border-color:var(--border)}
.prop-btn{height:24px;display:inline-flex;align-items:center;gap:4px;padding:0 8px;border-radius:var(--r-control);font-size:12px;font-weight:500;color:var(--text-primary);background:var(--n100)}
.prop-btn svg{width:12px;height:12px;color:var(--text-tertiary)}
/* popover */
.pop{position:fixed;background:#fff;border:1px solid var(--border);border-radius:12px;flex-direction:column;
  box-shadow:0 2px 8px rgba(0,0,0,.06),0 14px 28px rgba(0,0,0,.08);z-index:6}
.picker{right:416px;top:206px;width:320px}

.lgmk{display:grid;place-items:center;width:16px;color:var(--a-solid)}.lgmk svg{width:16px;height:16px}
.lgrow .lrt{font-size:14px;font-weight:500}
.lginp{width:132px;height:30px;display:flex;align-items:center;gap:4px;padding:0 8px;border:1px solid var(--border);border-radius:6px;background:#fff;flex:none;cursor:text}
.lginp:focus-within,.lginp.focus{border-color:var(--acc600);box-shadow:0 0 0 2px var(--acc200)}
.lginp input{border:0;outline:0;flex:1;min-width:0;font:500 13px/20px Inter,sans-serif;text-align:right;color:var(--text-primary);background:none;font-variant-numeric:tabular-nums}
.lginp .u,.lginp .pre{font-size:12px;color:var(--text-tertiary)}
.lgok{width:30px!important;height:30px!important;flex:none}.lgok svg{width:15px;height:15px}
.lgrow.logged .lginp,.lgrow.logged .lgok{display:none}
.lgrow.logged .lgdone{display:inline-flex}
.lgdone{display:none;align-items:center;gap:6px;font-size:12px;color:var(--text-secondary);flex:none}
.lgdone svg{width:15px;height:15px;color:#328f32}
/* needs a push */
.push .ag-body{padding:8px 16px 12px}
.push .crow{min-height:44px}
.push .crow .mark{width:16px;height:16px;display:grid;place-items:center;flex:none;margin:0}
.push .crow .mark svg{width:16px;height:16px}
.ibx .ibm{color:var(--text-tertiary)}
.ibx .lrt{font-size:14px}
.ibx{cursor:pointer;border-radius:6px}
.push .csec{margin-top:4px;padding-top:8px;border-top:1px solid var(--border)}
.push .csec+.csec{margin-top:8px}
.slink{display:inline-flex;align-items:center;gap:2px;cursor:pointer;border-radius:4px;padding:2px 4px 2px 0}
.slink svg{width:13px;height:13px;color:var(--text-tertiary)}
.slink:hover .t-label{color:var(--text-primary)}
.mmk{color:var(--a-solid)}
.push .rbm{width:12px;height:12px}
.push .pj{display:inline-flex;align-items:center;gap:3px}.push .pj svg{width:11px;height:11px;color:var(--a-solid)}
.slr{white-space:nowrap;flex:none}
.more{display:inline-block;font-size:12px;font-weight:500;color:var(--text-secondary);padding:4px 0 2px 26px;cursor:pointer}
.more:hover{color:var(--text-primary);text-decoration:underline;text-underline-offset:2px}

/* coming up */
.cucard .sbody{padding:0 8px 8px}
.cucard .aday:first-child{margin-top:0}
.pmk.tgt svg{width:14px;height:14px}
/* first run */
.hfrun{margin:auto;max-width:460px;gap:12px}
.hfrun .he-icon svg{width:24px;height:24px}
.frlist{width:100%;margin-top:12px;border:1px solid var(--border);border-radius:12px;padding:4px 16px;text-align:left}
.frrow{display:flex;align-items:center;gap:12px;min-height:56px}
.frrow+.frrow{border-top:1px solid #f1f2f4}
.frrow .lrt{font-size:14px}
.frc{width:20px;height:20px;border-radius:50%;border:2px dashed var(--n300);flex:none;display:grid;place-items:center;box-sizing:border-box}
.frc.ok{border:0;background:#328f32;color:#fff}.frc.ok svg{width:12px;height:12px;stroke-width:3}
.frrow .btn svg{width:14px;height:14px}
/* overlays */
.ov{display:none}
.hmenu{position:fixed;width:220px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:6px;z-index:25;
  box-shadow:0 2px 8px rgba(0,0,0,.06),0 14px 28px rgba(0,0,0,.10)}
#nm{right:24px;top:64px}
.hmenu .mi{cursor:pointer}
.hmenu .mi kbd{margin-left:auto;font:500 11px/16px Inter,sans-serif;color:var(--text-tertiary);border:1px solid var(--border);border-radius:4px;padding:0 4px}
.htoast{left:calc(48px + (100vw - 48px)/2)!important;bottom:72px}
.htoast.on{display:flex}
#tip{position:fixed;z-index:60;display:none;background:#111827;color:#fff;font-size:11px;padding:4px 7px;border-radius:5px;pointer-events:none;white-space:nowrap}
.states{max-width:calc(100vw - 24px)}.states .seg{flex-wrap:wrap;height:auto;row-gap:2px}.states .seg span{white-space:nowrap;height:24px}

.app.sapp{display:flex}
.sapp .side{border-right:1px solid var(--border);gap:2px}
.sapp .side .item{cursor:pointer}
.sapp .side .item svg{width:16px;height:16px;flex:none;color:var(--text-tertiary)}
.sapp .side .item.on svg{color:var(--acc600)}
.smain .content{display:flex;flex-direction:column;min-height:0;height:100vh}
.smain .areahead{padding:24px 24px 0;align-items:center}
.smain .ttl{height:28px}
.sscroll{flex:1;min-height:0;overflow:auto;padding:16px 24px 120px;scroll-behavior:smooth}
.scol{width:720px;display:flex;flex-direction:column;gap:16px}
.scol .scard{scroll-margin-top:16px}
.scol .shead{min-height:0;padding:12px 16px 4px}
.scol .sbody{padding:0 16px 4px}
/* rows: label left, control right */
.srow{display:flex;align-items:center;gap:16px;min-height:52px;padding:10px 0;border-top:1px solid var(--n100)}
.srow:first-child{border-top:0}
.slab{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.slab .sl{font-size:13px;line-height:18px;font-weight:500;color:var(--text-primary)}
.slab .sd{font-size:12px;line-height:16px;color:var(--text-tertiary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}

.sctl{display:flex;align-items:center;gap:8px;flex:none}
.sctl .val{font-size:13px;color:var(--text-secondary);font-variant-numeric:tabular-nums}
.sapp .btn{margin-left:0;color:var(--text-primary)}
.sapp .btn:hover{background:var(--n100)}
.sapp .btn[disabled]{opacity:.45;cursor:not-allowed;background:#fff}
.sapp .btn svg{width:14px;height:14px}
.sapp .ibtn{width:28px;height:28px;display:grid;place-items:center;border:1px solid var(--border);border-radius:var(--r-control);background:#fff;color:var(--text-secondary);cursor:pointer}
.sapp .ibtn:hover{background:var(--n100)}
.sapp .ibtn[disabled]{opacity:.45;cursor:not-allowed;background:#fff}
.sapp .ibtn svg{width:14px;height:14px}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* segmented group switch */
.sseg{display:flex;background:var(--n200);border-radius:var(--r-control);padding:2px;height:28px}
.sseg span{padding:0 12px;display:flex;align-items:center;font-size:12px;font-weight:500;color:var(--text-secondary);border-radius:4px;cursor:pointer}
.sseg span.on{background:#fff;color:var(--text-primary);box-shadow:0 1px 2px rgba(0,0,0,.08)}
/* HeroUI switch */
.sw{width:36px;height:20px;border-radius:999px;background:var(--n300);position:relative;cursor:pointer;transition:background .15s;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s}
.sw.on{background:var(--acc600)}
.sw.on::after{left:18px}
/* select */
.ssel{position:relative}
.ssel .sbtn{height:28px;min-width:128px;display:flex;align-items:center;gap:8px;padding:0 8px 0 10px;border:1px solid var(--border);border-radius:var(--r-control);background:#fff;font:500 12px/16px Inter,sans-serif;color:var(--text-primary);cursor:pointer}
.ssel .sbtn .v{flex:1;text-align:left;font-variant-numeric:tabular-nums}
.ssel .sbtn svg{width:14px;height:14px;color:var(--text-tertiary)}
.ssel.open .sbtn{border-color:var(--acc600);box-shadow:0 0 0 2px var(--acc200)}
.ssel.dis .sbtn{opacity:.45;cursor:not-allowed}
.slist{position:absolute;right:0;top:32px;min-width:100%;background:#fff;border:1px solid var(--border);border-radius:10px;padding:6px;z-index:10;
  box-shadow:0 2px 8px rgba(0,0,0,.06),0 14px 28px rgba(0,0,0,.08)}
.slist .mi{justify-content:space-between;font-variant-numeric:tabular-nums}
.slist .mi:hover{background:var(--n100)}
.slist .mi svg{width:14px;height:14px;color:var(--acc600)}
.slist .mi.on{font-weight:500}
.sapp ~ .toast2{left:calc(288px + (100vw - 288px)/2)}

<body>
<div class="app sapp" id="settings"><nav class="rail" aria-label="Groups"><div class="rail-pill"><div class="logo">L</div><a title="Home"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></a><a title="Tasks"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 7v7M12 7v4M16 7v9"/></svg></a><a title="Calendar"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg></a><a title="Areas"><svg viewBox="0 0 24 24"><circle cx="7" cy="7" r="4"/><rect x="13" y="3" width="8" height="8" rx="1"/><path d="M7 13l4 8H3z"/><rect x="13" y="13" width="8" height="8" rx="4"/></svg></a><div class="sp"></div><a class=on title="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></a></div></nav><aside class="side"><div class="item on" data-s="general"><svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>General</div><div class="item" data-s="data"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>Data</div><div class="item" data-s="about"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 16v-5M12 8h.01"/></svg>About</div></aside><main class="main smain"><div class="content"><div class="areahead"><div><div class="ttl"><h1 class="t-page">Settings</h1></div></div></div><div class="sscroll"><div class="scol"></div></div></div></main></div>
<div class="toast2 htoast" id="toast"><span class="ok"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg></span><span class="tmsg"></span><button class="link tundo">Undo</button><kbd>Ctrl Z</kbd></div>
<div class="states pstates"><span>Mock state</span><div class="seg" id="st"><span class=on data-p="normal" data-act="">Normal (defaults)</span><span data-p="changed" data-act="">Changed values</span><span data-p="normal" data-act="sel:dayend">Day ends at select</span><span data-p="normal" data-act="sel:keep">Keep last select</span><span data-p="nobackup" data-act="">No backups yet</span><span data-p="backing" data-act="">Backing up</span><span data-p="failed" data-act="">Backup failed</span><span data-p="missing" data-act="">Backup folder missing</span><span data-p="changed" data-act="reset">Reset layout, undo toast</span><span data-p="normal" data-act="export">Export done toast</span></div></div>
<div id="tip"></div>
<script>
const NOW_H=14,NOW_M=40;
const PRESETS={
  normal:{start:'Home',tf:'12',dayend:0,layout:false,auto:true,keep:14,folder:'ok',bk:'ok',last:[3,0],size:'2.4 MB'},
  changed:{start:'Calendar',tf:'24',dayend:3,layout:true,auto:true,keep:30,folder:'ok',bk:'ok',last:[3,0],size:'2.4 MB'},
  nobackup:{start:'Home',tf:'12',dayend:0,layout:false,auto:true,keep:14,folder:'ok',bk:'none'},
  backing:{start:'Home',tf:'12',dayend:0,layout:false,auto:true,keep:14,folder:'ok',bk:'busy',last:[3,0],size:'2.4 MB'},
  failed:{start:'Home',tf:'12',dayend:0,layout:false,auto:true,keep:14,folder:'ok',bk:'fail',last:[3,0],size:'2.4 MB',failAt:[14,12]},
  missing:{start:'Home',tf:'12',dayend:0,layout:false,auto:true,keep:14,folder:'missing',bk:'ok',last:[3,0],size:'2.4 MB'},
};
const FOLDER='C:\\Users\\Arzel\\Documents\\Life OS\\Backups', FOLDER_MISSING='D:\\Backups\\Life OS';
const DB='C:\\Users\\Arzel\\AppData\\Roaming\\Life OS\\life_os.db';
let S={},OPEN='';
const IC={
  chev:'<svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>',
  check:'<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>',
  folder:'<svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M13 11l3 3-3 3M8 14h8"/></svg>',
  spin:'<svg viewBox="0 0 24 24" class="spin"><path d="M21 12a9 9 0 1 1-6.2-8.6"/></svg>',
};
function tm(h,m){ // times on the hour drop ":00" in 12-hour
  if(S.tf==='24')return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
  const ap=h<12?'AM':'PM',h12=h%12===0?12:h%12;return h12+(m?':'+String(m).padStart(2,'0'):'')+' '+ap}
const DAYEND=[0,1,2,3,4];
function seg(key,opts,labels){return `<div class="sseg" data-k="${key}">${opts.map((o,i)=>`<span class="${S[key]===o?'on':''}" data-v="${o}">${labels?labels[i]:o}</span>`).join('')}</div>`}
function sel(key,opts,lab,dis){const open=OPEN===key&&!dis;
  return `<div class="ssel${open?' open':''}${dis?' dis':''}" data-k="${key}"><button class="sbtn"><span class="v">${lab(S[key])}</span>${IC.chev}</button>
    ${open?`<div class="slist">${opts.map(o=>`<div class="mi${o===S[key]?' on':''}" data-v="${o}">${lab(o)}${o===S[key]?IC.check:''}</div>`).join('')}</div>`:''}</div>`}
function row(label,ctl,data,err){return `<div class="srow"><div class="slab"><span class="sl">${label}</span>${data?`<span class="sd${err?' err':''}">${data}</span>`:''}</div><div class="sctl">${ctl}</div></div>`}
function card(id,title,rows){return `<section class="scard" id="sec-${id}"><header class="shead"><div><span class="stitle">${title}</span></div></header><div class="sbody">${rows}</div></section>`}
function backupLine(){
  if(S.bk==='none')return['No backups yet'];
  if(S.bk==='fail')return[`Failed today, ${tm(...S.failAt)} · couldn't write to the backup folder`,1];
  return[`Today, ${tm(...S.last)} · ${S.size}`];}
function render(){
  const main=document.querySelector('.scol');
  const general=
    row('Open on start',seg('start',['Home','Tasks','Calendar']))+
    row('Time format',seg('tf',['12','24'],['12-hour','24-hour']))+
    row('Day ends at',sel('dayend',DAYEND,h=>tm(h,0)))+
    row('Reset layout',`<button class="btn" data-a="reset"${S.layout?'':' disabled'}>Reset</button>`,S.layout?'Sidebar 280 px · 4 cards resized':'');
  const bl=backupLine(),miss=S.folder==='missing',busy=S.bk==='busy';
  const data=
    row('Automatic backups',`<span class="sw${S.auto?' on':''}" data-a="auto" role="switch"></span>`,S.auto&&S.bk!=='none'?`Daily, ${tm(3,0)}`:'')+
    row('Keep last',sel('keep',[7,14,30],n=>n+' backups',!S.auto))+
    row('Backup folder',`<button class="ibtn" title="Open folder"${miss?' disabled':''}>${IC.folder}</button><button class="btn" data-a="change">Change</button>`,
        miss?'Folder not found: '+FOLDER_MISSING:FOLDER,miss)+
    row('Last backup',S.bk==='fail'?`<button class="btn" data-a="backup">Retry</button>`:
        `<button class="btn" data-a="backup"${busy||miss?' disabled':''}>${busy?IC.spin+'Backing up':'Back up now'}</button>`,bl[0],bl[1])+
    row('Export all data',`<button class="btn" data-a="export">Export</button>`);
  const about=
    row('Version','<span class="val">0.1.0</span>')+
    row('Database',`<button class="ibtn" title="Open folder">${IC.folder}</button>`,DB);
  main.innerHTML=card('general','General',general)+card('data','Data',data)+card('about','About',about);
}
/* toast (the app's one toast design) */
const toastEl=document.getElementById('toast');let UNDO=null;
function toast(msg,undo){toastEl.querySelector('.tmsg').textContent=msg;toastEl.classList.add('on');UNDO=undo||null;
  toastEl.querySelector('.tundo').style.display=undo?'':'none';toastEl.querySelector('kbd').style.display=undo?'':'none';
  clearTimeout(window._tt);window._tt=setTimeout(()=>{if(!document.body.dataset.keep)toastEl.classList.remove('on')},6000)}
toastEl.querySelector('.tundo').onclick=()=>{if(UNDO)UNDO();UNDO=null;toastEl.classList.remove('on')};
function hideToast(){toastEl.classList.remove('on')}
/* actions */
function doReset(){const prev=S.layout;S.layout=false;render();toast('Layout reset',()=>{S.layout=prev;render()})}
function doExport(){toast('Exported life-os-2026-11-14.zip · 1.8 MB')}
function doBackup(){S.bk='busy';render();setTimeout(()=>{if(S.bk!=='busy')return;S.bk='ok';S.last=[NOW_H,NOW_M];S.size='2.4 MB';render()},1600)}
document.addEventListener('click',e=>{
  if(e.target.closest('.states'))return;
  const sg=e.target.closest('.sseg span');if(sg){const k=sg.parentElement.dataset.k;S[k]=sg.dataset.v;render();return}
  const mi=e.target.closest('.slist .mi');if(mi){const k=mi.closest('.ssel').dataset.k;S[k]=+mi.dataset.v;OPEN='';render();return}
  const sb=e.target.closest('.ssel .sbtn');if(sb){const w=sb.parentElement;if(w.classList.contains('dis'))return;const k=w.dataset.k;OPEN=OPEN===k?'':k;render();return}
  const a=e.target.closest('[data-a]');
  if(OPEN&&!e.target.closest('.ssel')){OPEN='';render()}
  if(!a||a.disabled)return;
  if(a.dataset.a==='auto'){S.auto=!S.auto;render()}
  if(a.dataset.a==='reset')doReset();
  if(a.dataset.a==='export')doExport();
  if(a.dataset.a==='backup')doBackup();
  if(a.dataset.a==='change'&&S.folder==='missing'){S.folder='ok';render()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&OPEN){OPEN='';render()}
  if(e.key==='z'&&e.ctrlKey&&UNDO){UNDO();UNDO=null;hideToast()}});
/* sidebar: scroll to a section, row follows the scroll */
const sc=document.querySelector('.sscroll');
document.querySelectorAll('.side .item').forEach(it=>it.onclick=()=>{const t=document.getElementById('sec-'+it.dataset.s);sc.scrollTo({top:t.offsetTop-sc.offsetTop-16,behavior:'smooth'});
  document.querySelectorAll('.side .item').forEach(x=>x.classList.toggle('on',x===it));});
/* mock states */
const st=document.getElementById('st');
function setState(sp){st.querySelectorAll('span').forEach(x=>x.classList.toggle('on',x===sp));
  S=JSON.parse(JSON.stringify(PRESETS[sp.dataset.p]));OPEN='';hideToast();delete document.body.dataset.keep;
  const act=sp.dataset.act||'';
  if(act.startsWith('sel:'))OPEN=act.slice(4);
  render();sc.scrollTop=0;
  document.querySelectorAll('.side .item').forEach((x,i)=>x.classList.toggle('on',i===0));
  if(act==='reset'){document.body.dataset.keep=1;doReset()}
